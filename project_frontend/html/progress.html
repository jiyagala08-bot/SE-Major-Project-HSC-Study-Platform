  <main>
  <div id="global-error" role="alert" aria-live="assertive" style="display:none; color: #950606; background: rgba(255,255,255,0.9); padding: 12px 20px; border-radius: 8px; text-align: center; margin: 10px auto; max-width: 600px;"></div>
   <div id="task-edit-overlay" style="
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.5);
    z-index:9998;
"></div>
  <div id="task-edit-popup" class="task-edit-popup" style="
    display:none;
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%, -50%);
    background:white;
    padding:20px;
    border-radius:10px;
    width:350px;
    box-shadow:0 0 20px rgba(0,0,0,0.3);
    z-index:9999;
  ">
  <h3>Edit Task</h3>
  <p> Task Title </p>
  <input id="edit-task-title" type="text" maxlength="100">
  <p> Task Description </p>
  <textarea id="edit-task-description" maxlength="500"></textarea>

  <p> Priority Level </p>
  <select id="edit-task-priority">
    <option value="">Select priority</option>
    <option value="1">Low</option>
    <option value="2">Medium</option>
    <option value="3">High</option>
  </select>

  <p> Subject </p>
  <select id="edit-task-subject"></select>

  <p> Due Date </p>
  <input id="edit-task-duedate" type="date">

  <p>Estimated hours to complete</p>
  <input id="edit-task-hours" type="number" min="0" step="0.1">

  <button id = "edit-task" onclick="saveTaskEdits()">Save</button>
  <button id = "cancel-edit" onclick="closeTaskEditor()">Cancel</button>
</div>
  <h1> Your Progress. </h1>
  <p id="daily-quote"></p>
  <div class="containers-wrapper">
  <div id="active-tasks" class="task-active-container">
    <h3>Active Tasks</h3>
    <ul id="task-list"></ul>
  </div>

  <div id="completed-tasks" class="task-complete-container">
    <h3>Completed Tasks</h3>
    <ul id="completed-task-list"></ul>
  </div>
  <div id = "complete-task-proportion" class = "complete-task-proportion-container">
  <h3>Overall Progress</h3>
  <div class="bar-container">
  <div id="my-progress-bar" class="bar-fill"></div>
  </div>
  <p id="progress-summary"></p>
  <p id="recommended-task"></p>
  </div>
</div>
<div class = "assessments-wrapper">
  <div class = "assmnt-container">
  <h3>Your Assessments So Far</h3>
  <ul id="assessment-list"></ul>
  </div>
</div>

  </main>
  <script src="/project_frontend/js/auth.js"></script>

  requireLogin();
  </script>
  <script src="/project_frontend/js/subjects_and_assmnts.js"></script>
  <script>
  requireLogin();
  </script>
  <script src="/project_frontend/js/progress.js"></script>
  <script>
  requireLogin();
  </script>
</body>
</html>
